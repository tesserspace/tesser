name: Visualization CI

on:
  push:
    branches: ["main"]
    paths:
      - "visualization/app/src-tauri/**"
      - ".github/workflows/visualization-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "visualization/app/src-tauri/**"
      - ".github/workflows/visualization-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  src_tauri_tests:
    name: visualization/app/src-tauri tests
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: visualization/app/src-tauri/target
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies (Tauri)
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            curl \
            wget \
            file

          # WebKitGTK dev package name differs across Ubuntu versions.
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev || \
            sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev

          # AppIndicator package name differs across distros.
          sudo apt-get install -y --no-install-recommends libayatana-appindicator3-dev || \
            sudo apt-get install -y --no-install-recommends libappindicator3-dev

          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf

      - name: Cache Cargo (src-tauri)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            visualization/app/src-tauri/target/
          key: ${{ runner.os }}-cargo-visualization-src-tauri-${{ hashFiles('visualization/app/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-visualization-src-tauri-

      - name: Run tests (src-tauri)
        run: cargo test --locked --manifest-path visualization/app/src-tauri/Cargo.toml
